# Builds the "pages" target and deploys it to GitHub Pages on every push to main (and by hand
# from the Actions tab). The unit and browser tests run first; a failing commit is not deployed.
# Needs the repo's Pages source set to "GitHub Actions". radmagelabs.com/ffxiv/ proxies these
# same files, so one deploy updates both addresses.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node tests/run.mjs
      - name: Build
        run: node tools/build.mjs pages
      - name: Browser and base-path tests in Chrome
        run: node tests/smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
