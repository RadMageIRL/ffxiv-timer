# Runs the tests on every push and pull request. Nothing is installed: the unit tests need only
# Node, and the browser tests drive the Chrome that GitHub's Ubuntu runners come with.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Every script parses
        run: for f in js/*.js tools/*.mjs tools/lib/*.mjs tests/*.mjs tests/lib/*.mjs; do node --check "$f" || exit 1; done
      - name: Generated weather data matches the pinned game tables
        run: node tools/build-weather.mjs --check
      - name: Unit tests
        run: node tests/run.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser and base-path tests in Chrome
        run: node tests/smoke.mjs
